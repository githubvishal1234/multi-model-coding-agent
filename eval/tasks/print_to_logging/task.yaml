id: print_to_logging
class: small_edit
instruction: >-
  Replace the print() calls in importer.py with logging through a module-level logger,
  logger = logging.getLogger(__name__). Log "importing ..." and "imported ..." at INFO and
  "skipping line ..." at WARNING, with the same message text. Do not configure logging in
  this module (no basicConfig or handlers). Behaviour must otherwise stay the same.
check:
  command: ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
  files: check
solution: solution
