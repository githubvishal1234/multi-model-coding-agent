[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrule"
version = "0.1.0"
description = "Local coding agent for free models"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyyaml>=6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ferrule = "ferrule.cli:main"

[tool.setuptools]
packages = ["ferrule", "ferrule.tools"]
package-data = {ferrule = ["models.yaml"]}

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval/tasks"]  # task snapshots contain deliberate bugs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
pythonpath = ["."]
